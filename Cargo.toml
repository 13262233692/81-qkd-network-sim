[package]
name = "qkd-network-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
fastrand = "2.0"
rayon = "1.10"
colored = "2.1"
indicatif = "0.17"
parking_lot = "0.12"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
